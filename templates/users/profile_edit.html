{% extends 'base.html' %}
{% load static %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto;">
    <div class="card" style="padding: 40px;">
        <h2 style="text-align: center; margin-bottom: 30px;">Edit Your Profile</h2>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
<div class="form-group">
                <label>{{ form.avatar.label }}</label>

                <!-- Current Avatar Preview -->
                <div style="margin-bottom: 15px; text-align: center;">
                    <img id="avatarPreview"
                        src="{% if user.avatar %}{{ user.avatar.url }}{% else %}{% static 'images/default-avatar.png' %}{% endif %}"
                        alt="Avatar Preview" class="profile-avatar"
                        onerror="this.onerror=null;this.src='{% static 'images/default-avatar.png' %}';">
                </div>

                {{ form.avatar }}
                <small style="color: var(--primary-mid); display: block; margin-top: 5px;">Upload a profile
                    picture</small>

                <button type="button" onclick="clearAvatar()"
                    style="margin-top: 10px; padding: 5px 15px; background: #ff7675; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 0.9rem;">Remove
                    Avatar</button>
                    
                <!-- Hidden input to signal avatar removal -->
                <input type="hidden" name="clear_avatar" id="clear_avatar" value="false">
            </div>
            
            <div class="form-group">
                <label>{{ form.bio.label }}</label>
                {{ form.bio }}
            </div>

            

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 15px; font-size: 1.1rem;">
                Save Profile
            </button>
        </form>

        <div style="text-align: center; margin-top: 20px;">
            <a href="{% url 'profile' username=user.username %}" style="color: var(--primary-mid);">Cancel</a>
        </div>
    </div>
</div>

<script>
    const avatarInput = document.getElementById('id_avatar');
    const avatarPreview = document.getElementById('avatarPreview');
    const clearAvatarInput = document.getElementById('clear_avatar');
    const defaultAvatar = "{% static 'images/default-avatar.png' %}";

    avatarInput.addEventListener('change', function (e) {
        const file = e.target.files[0];

        if (file) {
            const reader = new FileReader();

            reader.onload = function (e) {
                avatarPreview.src = e.target.result;
            };

            reader.readAsDataURL(file);
            // If user uploads a new file, reset the clear flag
            clearAvatarInput.value = "false";
        }
    });

    function clearAvatar() {
        avatarInput.value = '';
        avatarPreview.src = defaultAvatar;
        // Signal backend to remove the avatar
        clearAvatarInput.value = "true";
    }
</script>
{% endblock %}
