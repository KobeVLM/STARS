{% extends 'base.html' %}

{% block content %}
<div style="max-width: 500px; margin: 60px auto;">
    <div class="card" style="padding: 40px;">
        <h2 style="text-align: center; margin-bottom: 30px;">Welcome Back</h2>
        
        <form method="POST">
            {% csrf_token %}
            
            <div class="form-group">
                <label>Username</label>
                {{ form.username }}
            </div>

            <div class="form-group">
                <label>Password</label>
                {{ form.password }}
            </div>

            {% if form.errors %}
                <p style="color: #d63031; margin-bottom: 15px;">Invalid username or password.</p>
            {% endif %}

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 15px; font-size: 1.1rem;">
                Login
            </button>
        </form>
        
        <p style="text-align: center; margin-top: 20px; color: var(--text-light);">
            Don't have an account? <a href="{% url 'register' %}" style="color: var(--primary);">Sign up</a>
        </p>
    </div>
</div>
{% endblock %}
