{% extends 'base.html' %}
{% load static %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto;">
    <div class="card" style="padding: 40px;">
        <h2 style="text-align: center; margin-bottom: 30px;">Share Your Creation</h2>
        
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div class="upload-area" id="uploadArea">
                <p style="margin-bottom: 10px; color: var(--text-light);">📁 Upload your artwork</p>
                {{ form.image }}
                
                <!-- Image Preview -->
                <div id="imagePreview" style="display: none; margin-top: 15px;">
                    <img id="previewImg" src="" alt="Preview" style="max-width: 100%; max-height: 400px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                    <button type="button" onclick="clearPreview()" style="margin-top: 10px; padding: 5px 15px; background: #ff7675; color: white; border: none; border-radius: 5px; cursor: pointer;">Remove Image</button>
                </div>
            </div>

            <div class="form-group">
                <label>{{ form.title.label }}</label>
                {{ form.title }}
            </div>

            <div class="form-group">
                <label>{{ form.description.label }}</label>
                {{ form.description }}
            </div>

            <div class="form-group">
                <label>{{ form.tags_input.label }}</label>
                {{ form.tags_input }}
                <small style="color: var(--text-light); display: block; margin-top: 5px;">Separate tags with commas</small>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 15px; font-size: 1.1rem;">
                Post Artwork (+50 XP) 🚀
            </button>
        </form>
    </div>
</div>

<script>
    const imageInput = document.getElementById('id_image');
    const imagePreview = document.getElementById('imagePreview');
    const previewImg = document.getElementById('previewImg');
    const uploadArea = document.getElementById('uploadArea');

    imageInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        
        if (file) {
            const reader = new FileReader();
            
            reader.onload = function(e) {
                previewImg.src = e.target.result;
                imagePreview.style.display = 'block';
                uploadArea.style.borderColor = 'var(--primary)';
            };
            
            reader.readAsDataURL(file);
        }
    });

    function clearPreview() {
        imageInput.value = '';
        imagePreview.style.display = 'none';
        uploadArea.style.borderColor = '#ccc';
    }
</script>
{% endblock %}
