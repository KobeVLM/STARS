{% extends 'base.html' %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 40px auto; padding: 30px;">
    <h2 style="margin-bottom: 20px;">Appeal Suspension</h2>
    <p style="color: var(--text-light); margin-bottom: 20px;">
        If you believe your comment suspension was a mistake, you can appeal to the moderation team here.
    </p>

    <form method="POST">
        {% csrf_token %}
        <div class="form-group" style="margin-bottom: 20px;">
            <label for="reason" style="display: block; margin-bottom: 8px; font-weight: 500;">Reason for Appeal</label>
            <textarea name="reason" id="reason" rows="5" class="form-control" placeholder="Please explain why your suspension should be lifted..." required style="width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; font-family: inherit; resize: vertical;"></textarea>
        </div>
        
        <div style="display: flex; gap: 10px;">
            <button type="submit" class="btn btn-primary" style="flex: 1;">Submit Appeal</button>
            <a href="{% url 'feed' %}" class="btn btn-outline" style="text-align: center; flex: 1;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
